:root{
  --bg:#e6e5f0; --bg2:#d9d7e8; --panel:#f6f5fb; --panel2:#ecebf5; --line:#c4c1da; --tx:#1b1938; --tx2:#57547c; --tx3:#7d7aa0;
  --gold:#b8871c; --goldhi:#e8c15a; --accent:#3b2f8f;
  --blood:#ff3b4f; --heal:#3ddc78; --shield:#6fb8ff; --sp:#62a8ff;
  --e1:#c98a3c; --e2:#8a5fd6; --e3:#2f8fd0;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 8px rgba(30,20,80,.12);
  --fd:'Grenze Gotisch','UnifrakturMaguntia','Old English Text MT',Georgia,serif;
  --fu:'Chakra Petch','Rajdhani','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121127; --bg2:#1a1936; --panel:#1d1b3b; --panel2:#24224a; --line:#34315f; --tx:#ecebf7; --tx2:#aeabd1; --tx3:#7e7ba6;
    --gold:#e8c15a; --goldhi:#ffdf8a; --accent:#a99bff;
    --e1:#e2a35a; --e2:#c7a0ff; --e3:#5ec2ff;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121127; --bg2:#1a1936; --panel:#1d1b3b; --panel2:#24224a; --line:#34315f; --tx:#ecebf7; --tx2:#aeabd1; --tx3:#7e7ba6;
  --gold:#e8c15a; --goldhi:#ffdf8a; --accent:#a99bff;
  --e1:#e2a35a; --e2:#c7a0ff; --e3:#5ec2ff;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:var(--fu);font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--goldhi);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.pt{display:block;width:100%;height:100%}
.hide{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--panel2);color:var(--tx);box-shadow:var(--shadow);min-height:46px}
.btn.big{font-size:19px;padding:15px 22px;min-height:56px;border-radius:14px}
.btn.prime{background:linear-gradient(180deg,#f3cf6a,#c7952a);color:#1d1404;box-shadow:0 2px 0 #8a6414,0 6px 18px rgba(200,150,40,.35)}
.btn.prime:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.ib{border:0;background:transparent;width:42px;height:42px;border-radius:10px;font-size:19px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx)}
.ib:active{background:rgba(127,127,170,.18)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;min-height:52px}
.top h2{flex:1;margin:0;font-family:var(--fd);font-weight:400;font-size:26px;letter-spacing:.3px;line-height:1}
.top .sub{font-size:12.5px;color:var(--tx2);display:block;font-family:var(--fu)}

/* ---------- title ---------- */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 28px;gap:20px;text-align:center;position:relative}
.logo{font-family:var(--fd);font-size:clamp(64px,20vw,104px);line-height:.85;margin:0;font-weight:400;
  background:linear-gradient(100deg,var(--e1) 0 33%,var(--e2) 33% 66%,var(--e3) 66%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tagline{color:var(--tx2);margin:-6px 0 0;font-size:15px;max-width:30ch}
.lineup{display:flex;justify-content:center;margin:4px 0}
.lineup .lp{width:46px;height:46px;border-radius:50%;overflow:hidden;margin-left:-12px;border:2px solid var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.lineup .lp:first-child{margin-left:0}
.menu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.menu .btn{justify-content:space-between}
.menu .btn small{font-weight:600;opacity:.75;font-size:13px}
.corner{position:absolute;top:6px;right:6px}

/* ---------- campaign ---------- */
.era-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-family:var(--fd);font-size:24px;color:var(--ec)}
.era-h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--ec),transparent);opacity:.6}
.stage{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);position:relative}
.stage .no{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--ec);color:#140f20}
.stage.boss .no{border-radius:8px;transform:rotate(45deg)}
.stage.boss .no span{transform:rotate(-45deg)}
.stage h3{margin:0;font-size:16px}
.stage p{margin:2px 0 6px;font-size:12.5px;color:var(--tx2)}
.mini{display:flex;gap:4px}
.mini .m{width:28px;height:28px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.25)}
.stars{display:flex;gap:1px;font-size:18px;color:var(--line);letter-spacing:-1px}
.stars .on{color:var(--goldhi);text-shadow:0 0 6px rgba(255,200,60,.6)}
.stage.locked{opacity:.5}
.stage.locked .no{background:var(--line)}

/* ---------- team select ---------- */
.foes{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:4px 0 10px}
.foes .m{width:34px;height:34px;border-radius:8px;overflow:hidden}
.foes .fn{flex:1;font-size:12.5px;color:var(--tx2);line-height:1.3}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.slot{position:relative;aspect-ratio:3/4;border-radius:14px;border:2px dashed var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;padding:0;overflow:hidden}
.slot.full{border:2px solid var(--hc);padding:0}
.slot .p{width:100%;flex:1;min-height:0}
.slot .lbl{width:100%;padding:4px 4px 5px;background:var(--panel);font-weight:700;font-size:13px;color:var(--tx);border-top:2px solid var(--hc)}
.slot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(10,8,30,.7);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.syns{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-bottom:6px}
.syn{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;border:1.5px solid var(--sc);background:color-mix(in srgb,var(--sc) 18%,var(--panel));color:var(--tx)}
.syn.off{opacity:.55;border-style:dashed;font-weight:600;background:transparent}
.hint{font-size:12.5px;color:var(--tx2);margin:2px 0 10px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.rc{position:relative;border:2px solid transparent;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);padding:0;overflow:hidden;text-align:left}
.rc .p{aspect-ratio:1;width:100%}
.rc .meta{padding:4px 6px 6px}
.rc b{display:block;font-size:13.5px;line-height:1.15}
.rc small{display:block;font-size:11.5px;color:var(--tx2)}
.rc .dots{position:absolute;top:5px;left:5px;display:flex;gap:3px}
.rc .dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.rc .leg{position:absolute;top:4px;right:4px;font-size:10.5px;font-weight:700;background:#0d0c20d0;color:var(--goldhi);border-radius:6px;padding:1px 5px}
.rc.sel{border-color:var(--hc);box-shadow:0 0 0 2px var(--hc),0 6px 16px rgba(0,0,0,.25)}
.rc.sel::after{content:"✓";position:absolute;top:calc(50% - 30px);left:calc(50% - 18px);width:36px;height:36px;border-radius:50%;background:var(--hc);color:#111;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px}
.rc.dim{opacity:.45}
.rc .info{position:absolute;bottom:4px;right:4px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.footbar{padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--bg2);display:flex;gap:8px;align-items:center}
.footbar .btn{flex:1}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,24,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--panel);color:var(--tx);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:sheetUp .22s cubic-bezier(.2,.9,.3,1.1)}
.sheet h3{font-family:var(--fd);font-weight:400;font-size:30px;margin:0;line-height:1}
.sheet h4{margin:14px 0 4px;font-size:15px}
.sheet p{margin:4px 0;font-size:14px;color:var(--tx2)}
.sheet .head{display:flex;gap:12px;align-items:center}
.sheet .head .p{width:92px;height:92px;border-radius:14px;overflow:hidden;flex:none;border:2px solid var(--hc)}
.sheet .close{position:sticky;top:0;float:right}
.abil{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.abil .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px}
.abil b{font-size:14.5px}
.abil .k{font-size:11.5px;font-weight:700;color:var(--tx3);margin-left:6px}
.abil p{margin:2px 0 0}
.statrow{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.statrow .bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden}
.statrow .bar i{display:block;height:100%;background:var(--hc)}
.statrow span:last-child{text-align:right;font-weight:700}
.bio{font-style:normal;border-left:3px solid var(--hc);padding-left:10px}
.sts-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sts-list div{font-size:13.5px}
.help h4{color:var(--tx)}
.help ul{margin:4px 0;padding-left:18px;color:var(--tx2);font-size:14px}
.help li{margin:3px 0}

/* =================== BATTLE (always dark) =================== */
.scr-battle{--tx:#efeefa;--tx2:#b3b0d6;--tx3:#8481ae;--line:#3a3768;--panel:#1c1a3a;--panel2:#262452;
  color:var(--tx);background:radial-gradient(120% 70% at 50% 0%,#2a2058 0%,#17153a 45%,#0e0d24 100%);position:relative}
.scr-battle.era-first{background:radial-gradient(120% 70% at 50% 0%,#4a2a1a 0%,#1f1630 50%,#0e0d24 100%)}
.scr-battle.era-second{background:radial-gradient(120% 70% at 50% 0%,#3b2364 0%,#1a1638 50%,#0e0d24 100%)}
.scr-battle.era-current{background:radial-gradient(120% 70% at 50% 0%,#14365e 0%,#141a3a 50%,#0e0d24 100%)}
.bt-top{display:flex;align-items:center;gap:2px;padding:4px 4px 0}
.bt-top .st-name{flex:1;min-width:0;text-align:center;font-family:var(--fd);font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-top .st-name small{display:block;font-family:var(--fu);font-size:11.5px;color:var(--tx2)}
.tog{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:9px;height:34px;min-width:40px;padding:0 8px;font-weight:700;font-size:13.5px}
.tog.on{background:var(--goldhi);color:#1d1404;border-color:var(--goldhi)}
.tl{display:flex;gap:5px;align-items:center;padding:6px 10px 4px;overflow:hidden}
.tl .tlab{font-size:11px;color:var(--tx3);margin-right:2px}
.tl .t{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid var(--c);opacity:.92;position:relative}
.tl .t.e{border-radius:7px}
.tl .t.now{width:40px;height:40px;opacity:1;box-shadow:0 0 0 2px #fff,0 0 12px var(--c)}
.tl .sep{width:10px;height:2px;background:var(--line);flex:none}

.arena{flex:1;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px 6px;min-height:0}
.row{display:flex;justify-content:center;gap:6px;align-items:flex-start}
.row.en{align-items:flex-end}
.mid{flex:1;min-height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.caption{display:inline-flex;align-items:center;gap:7px;max-width:94%;padding:6px 14px;border-radius:999px;background:rgba(10,8,30,.75);border:1.5px solid var(--c,#666);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:capIn .2s}
.caption small{color:var(--tx2);font-weight:600}

.card{position:relative;width:calc((100% - 12px)/3);max-width:168px;display:flex;flex-direction:column;align-items:stretch;transition:opacity .3s,filter .3s}
.card.solo{width:52%;max-width:240px}
.por{position:relative;border-radius:12px;border:2px solid var(--c);overflow:visible;aspect-ratio:1;background:#000;transition:box-shadow .2s,transform .2s}
.por .pi{position:absolute;inset:0;border-radius:10px;overflow:hidden}
.card.en .por{border-radius:12px}
.card.boss .por{border-width:3px;box-shadow:0 0 0 2px #0008,0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
.card .hit{position:absolute;inset:0;border-radius:10px;background:#ff2a3a;opacity:0;pointer-events:none;mix-blend-mode:screen}
.card .bub{position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--shield);box-shadow:0 0 16px var(--shield),inset 0 0 18px rgba(111,184,255,.45);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;pointer-events:none}
.card.shielded .bub{opacity:.85;transform:scale(1)}
.card.crys .por::after{content:"💎";position:absolute;left:-6px;top:-8px;font-size:20px;filter:drop-shadow(0 0 6px #ffe066)}
.nm{display:flex;align-items:baseline;justify-content:space-between;gap:4px;margin:4px 1px 2px;font-weight:700;font-size:13px;line-height:1.1}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm em{font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:600;flex:none}
.hp{position:relative;height:15px;border-radius:5px;background:#0a0918;border:1px solid #000;overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0}
.hp .g{background:#fff;transition:width .55s ease-in .35s}
.hp .f{transition:width .18s ease-out}
.card.pl .hp .f{background:linear-gradient(180deg,#6dff9e,#20b85a)}
.card.en .hp .f{background:linear-gradient(180deg,#ff6b78,#c51c33)}
.hp .f.low{background:linear-gradient(180deg,#ffb04a,#e0601a)!important}
.hp .s{background:repeating-linear-gradient(135deg,#8fd0ff 0 4px,#4b98ea 4px 8px);opacity:.92;border-right:2px solid #dff2ff}
.hp b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 1px 1px #000;letter-spacing:.2px}
.ult{position:relative;height:7px;margin-top:3px;border-radius:4px;background:#0a0918;overflow:hidden;border:1px solid #000}
.ult i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b98a1e,#ffdf8a);transition:width .3s}
.card.ready .ult i{background:linear-gradient(90deg,#ffdf8a,#fff6d0,#ffdf8a);background-size:200% 100%;animation:shine 1s linear infinite}
.card.ready .por{box-shadow:0 0 0 2px #ffdf8a,0 0 16px rgba(255,223,138,.7)}
.sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;min-height:20px}
.sb{position:relative;display:inline-flex;align-items:center;gap:1px;height:20px;padding:0 4px 0 3px;border-radius:6px;font-size:12px;background:color-mix(in srgb,var(--c) 22%,#0c0b1e);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);line-height:1}
.sb.debuff{border-style:dashed}
.sb b{font-size:10.5px;font-weight:700;color:#fff;margin-left:1px}
.intent{display:flex;flex-direction:column;gap:3px;margin-bottom:4px;min-height:24px;justify-content:flex-end}
.ip{display:flex;align-items:center;gap:4px;border-radius:8px;padding:3px 6px;font-size:11.5px;font-weight:700;background:rgba(10,8,30,.82);border:1.5px solid #ff5a68;line-height:1.15}
.ip.buff{border-color:#59d68a}.ip.spec{border-color:#b98cff}
.ip .mv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ip .tg{color:#ffd2d6;flex:none;white-space:nowrap}
.ip.buff .tg{color:#c9ffd9}
.inc{position:absolute;left:50%;top:-12px;transform:translateX(-50%);z-index:4;font-size:12px;font-weight:800;padding:2px 7px;border-radius:999px;background:#2a0710;border:1.5px solid #ff4a5c;color:#ffd0d5;white-space:nowrap;box-shadow:0 2px 8px #0008}
.inc.lethal{background:#ff2a3f;color:#fff;border-color:#fff;animation:pulse .7s ease-in-out infinite alternate}
.card.now .por{transform:translateY(-3px);box-shadow:0 0 0 3px #fff,0 0 22px var(--c)}
.card.en.now .por{transform:translateY(3px)}
.turnflag{position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;white-space:nowrap;font-size:10px;font-weight:800;color:#111;background:#fff;border-radius:5px;padding:1px 5px;display:none;z-index:3}
.card.now .turnflag{display:block}
.card.ko{filter:grayscale(1) brightness(.55);opacity:.65}
.card.ko .por{transform:rotate(-4deg) translateY(4px)}
.card.ko .kotag{display:flex}
.kotag{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-family:var(--fd);font-size:26px;color:#ff9aa5;text-shadow:0 2px 6px #000;z-index:2}
.card.tgt{cursor:pointer}
.card.tgt .por{box-shadow:0 0 0 3px var(--tc,#ff4a5c),0 0 18px var(--tc,#ff4a5c);animation:bob .9s ease-in-out infinite alternate}
.card.tgt.ally .por{--tc:#4dff8a}
.pv{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;pointer-events:none;font-weight:800;font-size:17px;padding:3px 9px;border-radius:9px;background:rgba(15,5,15,.86);border:2px solid #ff5a68;color:#fff;white-space:nowrap;text-shadow:0 1px 0 #000}
.pv.heal{border-color:#4dff8a;color:#b8ffd0}.pv.shield{border-color:#6fb8ff;color:#cfe8ff}.pv.txt{border-color:#e8c15a;color:#ffe9b0;font-size:13px}
.pv.ko{background:#ff2a3f;border-color:#fff}
.pv small{font-size:10px;font-weight:700;opacity:.85;display:block;text-align:center;margin-top:-2px}
.actname{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);z-index:6;white-space:nowrap;font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--c);color:#111;pointer-events:none;animation:capIn .2s}

/* floats */
.fl{position:absolute;left:50%;top:40%;z-index:20;pointer-events:none;font-weight:800;white-space:nowrap;transform:translate(-50%,-50%);
  font-size:22px;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.9);paint-order:stroke fill;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6);
  animation:floatUp 1.15s cubic-bezier(.2,.8,.3,1) forwards}
.fl.dmg{color:#fff}
.fl.crit{color:#ffd34a;font-size:31px;animation:critPop 1.3s cubic-bezier(.2,.8,.3,1) forwards}
.fl.crit::before{content:"CRIT ";font-size:15px;vertical-align:middle}
.fl.heal{color:#5dff8f}
.fl.healcrit{color:#b8ffcf;font-size:27px}
.fl.shield{color:#8fd0ff;font-size:17px}
.fl.absorb{color:#8fd0ff;font-size:15px}
.fl.miss{color:#d0d3e6;font-size:18px;font-style:italic}
.fl.info{color:#ffe9b0;font-size:14px}
.fl.special{color:#ffdf8a;font-size:17px}
.fl.buff{color:#9effc0;font-size:13.5px}
.fl.debuff{color:#ffb2bd;font-size:13.5px}
.fl.cost{color:#ffb23d;font-size:15px}
.fl.burn{color:#ff8a3a}.fl.shock{color:#6fd6ff}.fl.bleed{color:#ff4a6a}.fl.poison{color:#a8f060}
.fl .rv{display:block;font-size:10.5px;color:#ff9a4a;-webkit-text-stroke:0;text-align:center}

/* action panel */
.act{padding:7px 10px 8px;background:linear-gradient(180deg,rgba(14,12,36,.6),#0c0b20);border-top:1px solid #2c2a58;height:var(--acth,172px);flex:none;overflow:hidden;display:flex;flex-direction:column}
.act .who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.act .who .p{width:30px;height:30px;border-radius:8px;overflow:hidden;border:2px solid var(--c)}
.act .who b{font-size:15px}
.act .who small{color:var(--tx2);font-size:12px}
.sp{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--tx2)}
.sp i{width:13px;height:13px;transform:rotate(45deg);border-radius:3px;background:#1a2244;border:1.5px solid #3a5a9a;transition:background .2s}
.sp i.on{background:linear-gradient(135deg,#bfe0ff,#3d8bff);border-color:#cfe6ff;box-shadow:0 0 8px #3d8bff}
.sp i.gain{animation:pop .4s}
.abtn{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ab{position:relative;border:2px solid #3a3768;background:#1c1a3a;border-radius:12px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:68px;color:var(--tx)}
.ab .i{font-size:22px;line-height:1}
.ab b{font-size:12.5px;line-height:1.1;text-align:center}
.ab small{font-size:11px;color:var(--tx2);font-weight:700}
.ab.sel{border-color:#fff;background:#2c2960;box-shadow:0 0 0 2px var(--c),0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.ab.ul{border-color:#6a5420}
.ab.ul.rdy{border-color:#ffdf8a;background:linear-gradient(180deg,#4a3a10,#2a2008);animation:ultGlow 1s ease-in-out infinite alternate}
.ab.ul.rdy small{color:#ffdf8a}
.ab:disabled{opacity:.4}
.ab .cost{position:absolute;top:4px;right:6px;font-size:11px;font-weight:800;color:#9fcbff}
.desc{font-size:12.5px;color:var(--tx2);margin:7px 2px 0;min-height:34px;line-height:1.35}
.desc b{color:var(--tx)}
.confirm{margin-top:6px;width:100%}
.waitmsg{display:flex;align-items:center;justify-content:center;height:120px;color:var(--tx2);font-size:14px;gap:8px}

/* fx */
.fx{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:visible}
.fx svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pj{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.slashfx{position:absolute;height:5px;border-radius:3px;transform-origin:center;background:linear-gradient(90deg,transparent,#fff 40%,var(--c) 60%,transparent);box-shadow:0 0 10px var(--c)}
.ring{position:absolute;border-radius:50%;border:3px solid var(--c);transform:translate(-50%,-50%)}
.part{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.colfx{position:absolute;top:-40px;transform:translateX(-50%);border-radius:0 0 40px 40px;background:linear-gradient(180deg,transparent,var(--c) 40%,#fff);filter:blur(1px);box-shadow:0 0 30px var(--c)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:70}
.banner{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);z-index:40;text-align:center;pointer-events:none;padding:14px 10px;background:linear-gradient(90deg,transparent,rgba(8,6,24,.92) 18%,rgba(8,6,24,.92) 82%,transparent);border-top:2px solid var(--c);border-bottom:2px solid var(--c)}
.banner h3{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(30px,9vw,44px);color:var(--c);line-height:1;text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.banner p{margin:4px 0 0;color:#e6e4f6;font-weight:700;font-size:14px}
.cine{position:fixed;inset:0;z-index:65;pointer-events:none;overflow:hidden}
.cine .band{position:absolute;left:-10%;right:-10%;top:30%;height:40%;background:linear-gradient(90deg,#000a,var(--c) 30%,var(--c) 70%,#000a);transform:skewY(-8deg);box-shadow:0 0 60px var(--c)}
.cine .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,255,255,.12) 40px 42px)}
.cine .cp{position:absolute;top:24%;width:min(42vw,240px);aspect-ratio:1;border-radius:18px;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 40px #000a}
.cine .ct{position:absolute;top:50%;transform:translateY(-50%);right:3%;left:47%;overflow-wrap:anywhere;text-align:left;color:#110c1a}
.cine.rev .ct{left:3%;right:47%;text-align:right}
.cine .ct h2{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(26px,7.4vw,50px);line-height:.95;color:#fff;text-shadow:0 3px 0 #000,0 0 20px #000}
.cine .ct p{margin:4px 0 0;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;font-size:15px}
.shake{animation:shake .32s}
.shake2{animation:shake2 .45s}
.jerk{animation:jerk .35s}

/* log */
.logbox{font-size:13px;line-height:1.5}
.logbox div{padding:3px 0;border-bottom:1px solid var(--line)}
.logbox .p{color:#9fd0ff}.logbox .e{color:#ffb2bd}.logbox .ko{color:#ff6a7a;font-weight:700}.logbox .i{color:var(--tx2)}

/* result */
.res{position:absolute;inset:0;z-index:50;background:rgba(8,6,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px;animation:fadeIn .3s;overflow-y:auto}
.res h2{margin:0;font-family:var(--fd);font-weight:400;font-size:64px;line-height:.9}
.res h2.win{color:var(--goldhi);text-shadow:0 0 24px rgba(255,200,60,.5)}
.res h2.lose{color:#ff6a7a}
.bigstars{display:flex;gap:10px;font-size:46px;color:#3a3768}
.bigstars span{display:inline-block}
.bigstars .on{color:var(--goldhi);text-shadow:0 0 16px rgba(255,200,60,.7);animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
.conds{font-size:13px;color:var(--tx2);text-align:left;width:100%;max-width:330px}
.conds div{display:flex;gap:8px}
.conds .ok{color:#7dffb0}
.stats{width:100%;max-width:330px;display:flex;flex-direction:column;gap:8px}
.sr{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center}
.sr .p{width:40px;height:40px;border-radius:9px;overflow:hidden;border:2px solid var(--c)}
.sr .bars{font-size:11.5px;color:var(--tx2)}
.sr .bars div{display:flex;align-items:center;gap:6px}
.sr .bars i{display:block;height:6px;border-radius:3px}
.mvp{font-size:10.5px;font-weight:800;background:var(--goldhi);color:#1d1404;border-radius:4px;padding:0 5px;margin-left:4px}
.resbtns{display:flex;gap:8px;width:100%;max-width:330px}
.resbtns .btn{flex:1}
.boons{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px}
.boon{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;border:2px solid #3a3768;background:#1c1a3a;border-radius:14px;padding:12px;color:var(--tx)}
.boon .i{font-size:28px;text-align:center}
.boon b{font-size:16px}
.boon p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.boon:active,.boon:hover{border-color:var(--goldhi)}
.owned{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:20px;max-width:340px}

@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@keyframes capIn{from{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.caption{animation-name:capIn2}
@keyframes capIn2{from{opacity:0;transform:scale(.9)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}12%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}25%{transform:translate(-50%,-70%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}
@keyframes critPop{0%{opacity:0;transform:translate(-50%,-40%) scale(.3) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-70%) scale(1.45) rotate(3deg)}30%{transform:translate(-50%,-80%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes pulse{to{transform:translateX(-50%) scale(1.1)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes pop{50%{transform:rotate(45deg) scale(1.5)}}
@keyframes ultGlow{to{box-shadow:0 0 18px #ffdf8a,0 0 0 2px #ffdf8a}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
@keyframes shake2{0%,100%{transform:translate(0)}15%{transform:translate(-10px,4px) rotate(-1deg)}30%{transform:translate(9px,-5px) rotate(1deg)}45%{transform:translate(-7px,3px)}60%{transform:translate(6px,-2px)}80%{transform:translate(-3px,1px)}}
@keyframes jerk{0%,100%{transform:none}15%{transform:translateY(-8px) scale(1.06,.94)}30%{transform:translate(5px,3px) scale(.96,1.04)}50%{transform:translate(-4px,-2px)}70%{transform:translate(2px,1px)}}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#1b1938;color:#fff;border:1px solid #4a4680;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeIn .2s;max-width:90vw;text-align:center}
.ip{flex-wrap:wrap;row-gap:0}
.ip .tg{flex-basis:100%;padding-left:20px;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis}

/* ===== v1.1 ===== */
.scr-battle .por{aspect-ratio:auto;height:var(--ph,110px);width:100%}

.sts{flex-wrap:nowrap;overflow:hidden;min-height:20px;height:20px}
.sb.more{--c:#8481ae;font-size:10.5px;font-weight:700;color:#fff;padding:0 5px}
.ip .mv,.ip .tg{white-space:nowrap}
.ip.pierce{border-color:#ff9a3c;box-shadow:0 0 0 1px rgba(255,154,60,.35)}

.desc .hint{color:#ffdf8a;font-weight:700}
.btn.use{flex:none;min-height:0;padding:6px 16px;font-size:15px;align-self:center;height:42px}
.waitmsg{flex:1;height:auto}
.pv{max-width:96%;font-size:15px;padding:2px 7px;line-height:1.15}

.res{justify-content:flex-start;padding:0}

.unlock{display:flex;gap:10px;align-items:center;width:100%;max-width:330px;border:2px solid var(--c);border-radius:14px;padding:8px 10px;background:color-mix(in srgb,var(--c) 14%,#14122e);animation:starIn .5s cubic-bezier(.3,1.6,.5,1) .6s backwards}

.era-h small{font-family:var(--fu);font-size:12px;color:var(--tx2);margin-left:6px}
.stage .sb2{min-width:0}
.reward{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:700;color:var(--gold);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 2px}

.slot.full{display:block;position:relative;padding:0;border:2px solid var(--hc)}

.slot .lbl{display:block;line-height:1.15;text-align:center}

.rc.locked .p{filter:brightness(.18) grayscale(1)}

.builds{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bopt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;color:var(--tx)}

.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

let UID = 0;

const B = {};
const HOOK = {
  headless: false,
  sleep: () => Promise.resolve(),
  fx: async () => {},
  float: () => {},
  hurt: () => {},
  update: () => {},
  log: () => {},
  banner: async () => {},

  actName: () => {},
  ko: async () => {},
  revive: async () => {},
  choose: async () => null,
  rebuild: () => {},
  sfx: () => {}
};
const wait = ms => HOOK.sleep(ms);
const rnd = () => Math.random();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const isUp = u => !!u && u.alive && u.hp > 0;
const foesOf = u => (u.side === 'player' ? B.enemies : B.players).filter(isUp);
const friendsOf = u => (u.side === 'player' ? B.players : B.enemies).filter(isUp);
const getSt = (u, k) => u.statuses.find(s => s.key === k);
const has = (u, k) => !!getSt(u, k);
const hpPct = u => u.hp / u.maxHp;

let ARTID = 0;
const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)));
  return '#' + ((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1);
};

function svgWrap(inner, bg, id) {
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="pt" aria-hidden="true">
<defs>
<radialGradient id="bg${id}" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="${shade(bg, 0.18)}"/><stop offset="1" stop-color="${shade(bg, -0.6)}"/></radialGradient>
<filter id="gl${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
<filter id="gs${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1"/></filter>
</defs>
<rect width="100" height="100" fill="url(#bg${id})"/>${inner}</svg>`;
}

/* ================= UI: engine hooks ================= */
const live = () => !!UI.bt && !B.abort;
HOOK.sleep = ms => new Promise(r => setTimeout(r, T(ms)));
HOOK.fx = async (name, d) => {
  if (!live()) return;
  try { await (FX[name] || FX.slash)(d || {}); } catch (e) { console.warn('fx', name, e); }
};
HOOK.sfx = n => { if (live()) SND.play(n); };
HOOK.float = (u, text, cls, rival) => {
  if (!live()) return;
  const c = cardEl(u); if (!c) return;
  const por = c.querySelector('.por');
  const now = performance.now();
  const st = c._fl || (c._fl = { t: 0, n: 0 });
  st.n = (now - st.t < 380) ? st.n + 1 : 0; st.t = now;
  const s = document.createElement('div');
  s.className = 'fl ' + (cls || 'dmg');
  s.innerHTML = esc(text) + (rival ? '<span class="rv">Rival +20%</span>' : '');
  s.style.marginTop = (-Math.min(st.n, 5) * 22) + 'px';
  const dur = T(cls === 'crit' ? 1300 : 1150);
  s.style.animationDuration = dur + 'ms';
  por.appendChild(s);
  setTimeout(() => s.remove(), dur + 60);
};
HOOK.hurt = (u, crit, real) => {
  if (!live()) return;
  const c = cardEl(u); if (!c) return;
  const por = c.querySelector('.por');
  restartClass(por, crit || real > u.maxHp * 0.2 ? 'shake2' : 'shake');
  const hit = c.querySelector('.hit');
  if (hit) anim(hit, [{ opacity: crit ? 0.8 : 0.55 }, { opacity: 0 }], 300);
  if (crit) { shakeArena(false); flash('#fff1c0', 0.16, 160); }
  updateUnit(u);
};
HOOK.update = () => { if (UI.bt) update(); };
HOOK.log = (t, cls) => { UI.log.push([t, cls]); if (UI.log.length > 300) UI.log.shift(); };
HOOK.actName = (u, name, kind) => {
  if (!live()) return;
  let icon = '';
  if (u.isHero) { const hk = HEROES[u.id]; const ab = hk[kind] || ['basic', 'skill', 'ult'].map(k => hk[k]).find(x => x.name === name); icon = ab ? ab.icon : ''; }
  else { const m = (movesFor(u) || []).find(x => x.name === name); icon = m ? m.icon : ''; }
  caption(`${icon} ${esc(name)} <small>${esc(u.name)}</small>`, u.color);
};
HOOK.banner = async (title, sub, color) => {
  if (!live()) return;
  SND.play('banner');
  const b = document.createElement('div');
  b.className = 'banner'; b.style.setProperty('--c', color || '#ffdf8a');
  b.innerHTML = `<h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}`;
  UI.arena.appendChild(b);
  await anim(b, [{ opacity: 0, transform: 'translateY(-50%) scaleY(.2)' }, { opacity: 1, transform: 'translateY(-50%) scaleY(1)' }], 240);
  await W(1150);
  await anim(b, [{ opacity: 1 }, { opacity: 0 }], 260);
  b.remove();
};
HOOK.ult = async (u, a) => {
  if (!live()) return;
  SND.play('ult');
  const rev = u.side === 'enemy';
  const c = document.createElement('div');
  c.className = 'cine' + (rev ? ' rev' : '');
  c.style.setProperty('--c', u.color);
  c.innerHTML = `<div class="band"></div><div class="cp" style="${rev ? 'right' : 'left'}:5%">${portraitSVG(lookOf(u), { glow: u.heroId === 'harry' })}</div><div class="ct"><h2>${esc(a.name)}</h2><p>${esc(u.name)}</p></div>`;
  document.body.appendChild(c);
  const band = c.querySelector('.band'), cp = c.querySelector('.cp'), ct = c.querySelector('.ct');
  anim(band, [{ transform: 'skewY(-8deg) scaleY(0)' }, { transform: 'skewY(-8deg) scaleY(1)' }], 200);
  anim(cp, [{ transform: `translateX(${rev ? 120 : -120}%)` }, { transform: 'translateX(0)' }], 300, { easing: 'cubic-bezier(.2,.9,.3,1.1)' });
  await anim(ct, [{ opacity: 0, transform: `translateY(-50%) translateX(${rev ? -40 : 40}px)` }, { opacity: 1, transform: 'translateY(-50%) translateX(0)' }], 320);
  await W(650);
  await anim(c, [{ opacity: 1 }, { opacity: 0 }], 220);
  c.remove();
  flash(u.color, 0.25, 260);
};
HOOK.ko = async u => {
  if (!live()) return;
  updateUnit(u);
  const c = cardEl(u);
  if (c) { c.classList.add('ko'); burst(P(u), { color: '#888', n: 16, spread: 60, size: 8 }); }

HOOK.revive = async u => {
  if (!live()) return;
  const c = cardEl(u);

HOOK.rebuild = () => { if (UI.bt) { renderRows(); update(); } };

  const many = en && B.enemies.length >= 4;

/* ---------- team select ---------- */
function synergyInfo(team) {
  const act = SYNERGIES.filter(s => s.test(team));
  const near = [];
  if (team.length < 3) {
    for (const s of SYNERGIES) {
      if (act.includes(s)) continue;
      const adds = HERO_ORDER.filter(id => isUnlocked(id) && !team.includes(id) && s.test([...team, id]));
      if (!adds.length) continue;
      const need = (s.id === 'first' || s.id === 'second' || s.id === 'current') ? `1 more ${ERA[s.id].name} hero` : adds.map(id => HEROES[id].name).join(' or ');
      near.push({ s, need });
    }
  }
  return { act, near };
}
function rosterCard(id, sel, dim) {
  const h = HEROES[id];
  if (!isUnlocked(id)) {
    const st = STAGES.find(s => s.id === UNLOCK_FROM[id]);
    return `<div class="rc locked" data-id="${id}" role="button" tabindex="0" aria-label="${esc(h.name)} is locked">
<div class="p">${heroPortrait(id)}</div><span class="lk">🔒</span>
<div class="meta"><b>${esc(h.name)}</b><small>Clear ${esc(st ? st.name : 'the campaign')}</small></div></div>`;
  }
  const b = buildOf(id, SAVE.builds[id]);
  return `<div class="rc ${sel ? 'sel' : ''} ${dim ? 'dim' : ''}" data-id="${id}" style="--hc:${h.color}" role="button" tabindex="0" aria-pressed="${sel}">

<button class="info" data-info="${id}" aria-label="About ${esc(h.name)}">i</button></div>`;
}

  app().innerHTML = `<div class="scr">

  $('#back').onclick = () => (ctx.mode === 'campaign' ? showCampaign() : showTitle());
  $$('[data-rm]').forEach(b => b.onclick = e => { e.stopPropagation(); UI.team = UI.team.filter(x => x !== b.dataset.rm); SND.play('click'); renderTeam(); });

/* ---------- save backup: move progress between the online and offline versions ---------- */
function saveCode() { return 'TE1:' + btoa(unescape(encodeURIComponent(JSON.stringify(SAVE)))); }
function readCode(txt) {
  const t = String(txt || '').replace(/\s+/g, '');
  if (!t.startsWith('TE1:')) throw new Error('This is not a Three Eras save code.');
  const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));
  if (!o || typeof o !== 'object' || typeof o.stars !== 'object') throw new Error('The save code is damaged.');
  return o;
}
function backupSheet() {

  sheet(`<h3>Save backup</h3><p>Copy this code to keep a backup or to move your progress between the online and offline versions of the game. It holds your stars, team, builds, settings and records.</p>

<textarea class="codebox" id="exportCode" readonly rows="4">${esc(saveCode())}</textarea>
<div class="resbtns" style="max-width:none"><button class="btn prime" id="copyCode">Copy code</button>${offline ? '<button class="btn" id="dlCode">Download file</button>' : ''}</div>

<textarea class="codebox" id="importCode" rows="4" placeholder="Paste a save code that starts with TE1:"></textarea>
${offline ? '<p class="hint">Or load a backup file: <input type="file" id="importFile" accept=".txt,.json,text/plain"></p>' : ''}
<div class="resbtns" style="max-width:none"><button class="btn" id="mergeCode">Merge</button><button class="btn" id="replaceCode">Replace</button></div>

      const ta = $('#exportCode', bg), done = () => toast('Save code copied.');

    };

    const fi = $('#importFile', bg);

      if (mode === 'replace') { for (const k of Object.keys(SAVE)) delete SAVE[k]; Object.assign(SAVE, { stars: {}, team: [], best: 0, runs: 0, sound: true, speed: 1, builds: {}, seenUnlock: {} }, o); }

      store(); closeSheet(); showTitle(); toast(mode === 'replace' ? 'Save replaced.' : 'Saves merged.');
    };
    $('#mergeCode', bg).onclick = () => apply('merge');
    $('#replaceCode', bg).onclick = () => apply('replace');
  });

  app().innerHTML = `<div class="scr">
<div class="top"><button class="ib" id="back" aria-label="Back">←</button><h2>Custom battle<span class="sub">Heroes against heroes. No effect on progress.</span></h2></div>
<div class="scroll">
<h4 class="ch">Your team <small>${c.team.length} / 3</small></h4>
<div class="slots">${[0, 1, 2].map(i => slot(c.team[i], 'team')).join('')}</div>${synRow(tSyn)}
<h4 class="ch">Opponents <small>${c.foes.length} / 5</small></h4>
<div class="slots five">${[0, 1, 2, 3, 4].map(i => slot(c.foes[i], 'foes')).join('')}</div>${synRow(fSyn)}
<h4 class="ch">Opponent strength</h4>
<div class="bfilters">${powers.map(p => `<button class="bfc ${c.power === p ? 'on' : ''}" data-pw="${p}">${Math.round(p * 100)}%</button>`).join('')}</div>
<p class="hint">Strength scales opponents' HP and ATK.</p>
<div class="seg"><button class="${UI.cside === 'team' ? 'on' : ''}" data-side="team">Add to your team</button><button class="${UI.cside === 'foes' ? 'on' : ''}" data-side="foes">Add to opponents</button></div>
<p class="hint">${UI.cside === 'team' ? 'Your side uses unlocked heroes.' : 'Opponents can be any hero, including ones you haven\'t unlocked and ones also on your team.'} Tap a hero in a slot to change their build.</p>
<div class="roster">${roster}</div>
</div>
<div class="footbar"><button class="btn big prime" id="cgo" ${c.team.length && c.foes.length ? '' : 'disabled'}>${c.team.length && c.foes.length ? `Fight ${c.team.length} vs ${c.foes.length}` : 'Pick both sides'}</button></div></div>`;
  $('#back').onclick = showTitle;
  $$('[data-side]').forEach(b => b.onclick = () => { UI.cside = b.dataset.side; SND.play('click'); const sc = $('.scroll').scrollTop; showCustom(); $('.scroll').scrollTop = sc; });
  $$('[data-pw]').forEach(b => b.onclick = () => { c.power = +b.dataset.pw; store(); SND.play('click'); const sc = $('.scroll').scrollTop; showCustom(); $('.scroll').scrollTop = sc; });
  $$('[data-cs]').forEach(b => b.onclick = () => customBuildSheet(b.dataset.id, b.dataset.cs));
  $$('[data-crm]').forEach(b => b.onclick = e => { e.stopPropagation(); const id = b.dataset.id; if (b.dataset.crm === 'team') c.team = c.team.filter(x => x !== id); else c.foes = c.foes.filter(x => x !== id); store(); showCustom(); });
  $$('.rc').forEach(card => card.addEventListener('click', e => {
    const id = card.dataset.id;
    if (e.target.closest('[data-info]')) { e.stopPropagation(); heroSheet(id); return; }
    if (UI.cside === 'team') {
      if (!isUnlocked(id)) { toast('Unlock this hero in the campaign to use them on your side.'); return; }
      if (c.team.includes(id)) c.team = c.team.filter(x => x !== id);

  $('#cgo').onclick = () => { if (c.team.length && c.foes.length) startCustom(); };
}
function startCustom() {

  startBattle({ team: c.team.slice(), builds: Object.assign({}, SAVE.builds), enemies: c.foes.map(id => ({ id, hero: true, build: c.foeBuilds[id], atkMul: c.power, hpMul: c.power })), mode: 'custom' },
    { mode: 'custom', era: 'current', title: 'Custom battle', sub: `${c.team.length} vs ${c.foes.length}${c.power !== 1 ? `, opponents at ${Math.round(c.power * 100)}%` : ''}` });

/* ---------- guide ---------- */
const GUIDE_TABS = [['basics', 'Basics'], ['stats', 'Stats'], ['statuses', 'Statuses'], ['team', 'Team'], ['builds', 'Builds'], ['enemies', 'Enemies'], ['balance', 'Balance'], ['updates', 'Updates']];
const BTYPE = {
  buff:   { icon: '▲', label: 'Buff',     color: '#22c55e', desc: 'Stronger' },
  nerf:   { icon: '▼', label: 'Nerf',     color: '#ef4444', desc: 'Weaker' },
  rework: { icon: '⟳', label: 'Rework',   color: '#a855f7', desc: 'Works differently' },
  new:    { icon: '✦', label: 'New',      color: '#3b9cff', desc: 'New rule or mechanic' },
  harder: { icon: '▲', label: 'Harder',   color: '#f97316', desc: 'Stage got tougher' },
  easier: { icon: '▼', label: 'Easier',   color: '#14b8a6', desc: 'Stage got gentler' },
  adjust: { icon: '◆', label: 'Adjusted', color: '#d4a017', desc: 'Neutral or mixed change' }
};
const BPORT = {};
function bcWho(c) {
  const key = c.kind + ':' + c.who;
  let pic = BPORT[key], name;
  if (c.kind === 'hero') { name = HEROES[c.who].name; pic = pic || (BPORT[key] = heroPortrait(c.who)); }
  else if (c.kind === 'enemy') { name = ENEMIES[c.who].name; pic = pic || (BPORT[key] = enemyPortrait(c.who)); }
  else if (c.kind === 'stage') {
    const st = STAGES.find(x => x.id === c.who); name = st.name;
    const face = st.enemies.find(id => isHeroFoe(id)) || st.enemies.find(id => ENEMIES[id].boss) || st.enemies[0];
    pic = pic || (BPORT[key] = foePortrait(face));
  } else { name = c.who; pic = '<span class="sysic">⚙️</span>'; }
  return { name, pic };
}
function bcRow(c, showWho = true) {
  const T = BTYPE[c.t], w = bcWho(c);
  const nums = c.from != null ? ` <span class="ft"><span class="fr">${esc(c.from)}</span><span class="ar">→</span><b>${esc(c.to)}</b></span>` : '';
  return `<div class="bc" style="--bc:${T.color}">
<div class="bct"><span class="btag"><i>${T.icon}</i>${T.label}</span>${showWho ? `<span class="bwho"><span class="bp">${w.pic}</span>${esc(w.name)}</span>` : ''}${c.what ? `<span class="bwhat">${esc(c.what)}</span>` : ''}</div>
<div class="btx">${esc(c.text)}${nums}</div>${c.note ? `<div class="bnote">${esc(c.note)}</div>` : ''}</div>`;
}
function balanceBody() {
  const f = UI.bf || 'all';
  const kinds = { heroes: c => c.kind === 'hero', foes: c => c.kind === 'enemy' || c.kind === 'stage', system: c => c.kind === 'system' };
  const match = c => f === 'all' || c.t === f || (kinds[f] && kinds[f](c));
  const all = BALANCE.flatMap(v => v.changes);
  const count = k => all.filter(c => k === 'all' || c.t === k || (kinds[k] && kinds[k](c))).length;
  const chips = [['all', 'All'], ['buff', '▲ Buffs'], ['nerf', '▼ Nerfs'], ['rework', '⟳ Reworks'], ['heroes', 'Heroes'], ['foes', 'Enemies and stages'], ['system', 'Systems']]
    .map(([k, l]) => `<button class="bfc ${f === k ? 'on' : ''}" data-bf="${k}" ${BTYPE[k] ? `style="--bc:${BTYPE[k].color}"` : ''}>${l} <small>${count(k)}</small></button>`).join('');
  const legend = Object.values(BTYPE).map(T => `<span class="lg" style="--bc:${T.color}"><span class="btag"><i>${T.icon}</i>${T.label}</span>${T.desc}</span>`).join('');
  const groups = BALANCE.map(v => {
    const rows = v.changes.filter(match);
    if (!rows.length) return '';
    return `<div class="bver"><h4>v${esc(v.v)} <span>${esc(v.date)}</span></h4>${rows.map(c => bcRow(c)).join('')}</div>`;
  }).join('');
  return `<p>Only numbers and rules that changed. Features are in Updates. Buff and nerf describe the thing named: a stronger enemy is a buff to that enemy, while stages use Harder and Easier.</p>
<div class="legend">${legend}</div><div class="bfilters">${chips}</div>${groups || '<p>Nothing matches this filter.</p>'}`;
}
function guideBody(tab) {
  if (tab === 'basics') return `
<h4>Turn order</h4><p>Faster units act more often. Each unit waits 10000 ÷ SPD time units between turns, so 150 SPD acts 50% more often than 100 SPD. The strip under the top bar shows the next eight turns, with the current unit enlarged.</p>
<h4>Your turn</h4><p>Pick Basic, Skill or Ultimate, then tap a highlighted target. Every valid target shows a preview: damage, healing or Shield it would receive, its hit chance when below 100%, and KO if the hit should finish it.</p>
<p>Basics give the team 1 skill point (SP). Skills cost 1 SP. The team shares up to 5 SP, shown as blue diamonds. A good rhythm is to alternate basics and skills.</p>
<p>Ultimates charge as a hero acts: +20% for a basic, +30% for a skill and +6% when hit. At 100% the hero glows gold and the button lights up. Using one is the hero's whole turn.</p>
<h4>Reading the enemy</h4><p>Every enemy shows its next move and target above its portrait. Your heroes show ⚠ with the total damage heading their way. Lethal means it will knock them out unless you act: heal, Shield, guard or kill the attacker first.</p>
<p>🎯✕ on an intent means the move ignores Taunt. David's Guard still redirects it.</p>
<p>Tap the <b>i</b> on any card, or press and hold the card, to see its stats, statuses and moves at any time, even while you are picking a target. Turn order icons and the active hero's portrait in the action panel open details too. Tapping a card that isn't a valid target also opens its details.</p>
<h4>Stars</h4><p>One for winning, one if no hero falls, and one if your team's HP averages 50% or more at the end. Fallen heroes count as 0%.</p>
<h4>Unlocking heroes</h4><p>You start with Angus, Flynn and Leo. Clearing certain stages unlocks more heroes. The campaign map shows which stage unlocks whom.</p>
<h4>Gauntlet</h4><p>Endless waves with a boss every fifth wave. After each win the team heals 30% of max HP, the fallen return at 25%, and you pick one of three boons. Wounds and ultimate charge carry over. Only unlocked heroes can enter.</p>
<h4>Battle summary</h4><p>After every fight a table shows each hero's damage, healing, Shields, damage taken, kills, biggest hit, crits, hit rate, dodges, buffs and debuffs landed, actions and ultimates. Gold numbers lead their row. ${IMPACT_NOTE}</p>
<h4>Custom battle</h4><p>Pick up to 3 of your unlocked heroes and up to 5 opponents from the whole roster, with their builds and a strength setting. Opponents are controlled by the game, show their intents like any enemy, use their own SP pool and get their own team bonuses. Custom battles don't affect your progress.</p>
<h4>Controls</h4><p>Speed cycles 1×, 2× and 3×. Auto lets the team fight on its own and stays on between waves. On a keyboard, 1, 2 and 3 pick actions and Enter uses an area move.</p>`;
  if (tab === 'stats') return `
<h4>HP</h4><p>Health. At 0 the unit falls. Shield (blue stripes on the HP bar) absorbs damage before HP.</p>
<h4>ATK</h4><p>Attack. Every ability is a percentage of ATK. Damage over time (Burn, Shock, Bleed, Poison) is also based on the attacker's ATK when applied.</p>
<h4>DEF</h4><p>Defence. Damage is multiplied by 300 ÷ (300 + DEF).</p>
<div class="tbl"><div><b>DEF</b><b>Damage taken</b></div><div><span>50</span><span>86%</span></div><div><span>100</span><span>75%</span></div><div><span>150</span><span>67%</span></div><div><span>200</span><span>60%</span></div></div>
<p>Pierce (Harry's Katana Draw and Crush, for example) ignores part or all of the target's DEF.</p>
<h4>SPD</h4><p>Speed. Decides how often a unit acts. SPD buffs and debuffs change the turn order straight away.</p>
<h4>Crit and crit damage</h4><p>Crit chance is the chance a hit lands as a critical. Crits deal +50% damage by default (+60% for Harry and Yunze). Healing from Yousuf can also crit for +50%.</p>
<h4>EVA (evasion) and ACC (accuracy)</h4><p>Hit chance = 100% + attacker ACC - target EVA, capped at 100% and never below 5%. Blind takes a further 35% off. Afterimage dodges the next attack completely. Moves marked "cannot miss" ignore all of this.</p>
<div class="tbl"><div><b>Unit</b><b>EVA</b></div><div><span>Yunze</span><span>20%</span></div><div><span>Harry</span><span>15%</span></div><div><span>Gemia</span><span>14%</span></div><div><span>The Chosen</span><span>10%</span></div><div><span>Other heroes</span><span>3 to 8%</span></div><div><span>Wolves, wisps, afterimages</span><span>16 to 25%</span></div><div><span>Golems, the Idol, the Warden</span><span>0%</span></div></div>
<p>Some hero moves have bonus ACC (lightning, rapier, Phantom Switch). Heavy enemy attacks have -8% ACC.</p>
<h4>The damage formula</h4><p>ATK × ability % × 300 ÷ (300 + DEF) × (1 + damage bonuses) × damage taken modifiers × crit × a random 92% to 108%.</p>
<p>Damage bonuses add together: rivals +20%, Flynn vs Shocked +25%, Leo vs Burning +20%, Yunze vs the highest max HP enemy +30%, Executioner boon.</p>
<p>Damage taken modifiers multiply: Angus and The Chosen -12% (The Chosen also -3% per Grace stack), Guarding -35%, Stone Form -50%, Warded -50%, Plated -50%, Exposed +50%, Hunted +25% (from the Yunze who marked it only), Yousuf's Guard escort -25% for Yousuf.</p>
<h4>Stat changes</h4><p>Buffs and debuffs to ATK, DEF and SPD add together as percentages of the base stat. A stat can't fall below 25% of its base.</p>`;
  if (tab === 'statuses') return `<p>Solid borders are buffs, dashed borders are debuffs. The number on a badge is turns left, or stacks shown as ×2. A status lasts through its owner's turns: 2 turns means it wears off at the end of the owner's second turn.</p>
<div class="sts-list">${Object.entries(STATUS).filter(([k]) => k !== 'accUp').map(([k, d]) => `<div><b style="color:${d.color}">${d.icon} ${esc(d.name)}</b> <span style="color:var(--tx3)">${d.type === 'buff' ? 'Buff' : 'Debuff'}</span><br><span style="color:var(--tx2)">${esc(d.desc || (d.stat ? `${d.name.split(' ')[0]} ${d.neg ? 'lowered' : 'raised'} by the listed percentage.` : ''))}</span></div>`).join('')}</div>`;
  if (tab === 'team') return `
<h4>Team bonuses</h4>${SYNERGIES.map(s => `<p><b style="color:var(--tx)">${s.icon} ${esc(s.name)}.</b> ${esc(s.desc)}</p>`).join('')}
<p>Harry counts as all three eras. Yunze and Malakai count as Second and Current Era.</p>
<h4>Rivals</h4><p>Rivals deal 20% more damage to each other. Afterimages of Yunze count as Yunze.</p>${Object.entries(RIVALS).map(([a, bs]) => `<p>${esc(HEROES[a].name)} → ${esc(bs.map(b => HEROES[b].name).join(', '))}</p>`).join('')}
<h4>Legends</h4><p>Harry and Yunze are Legends. Only one per team.</p>
<h4>Unlocks</h4><p>Starters: Angus, Flynn and Leo.</p>${STAGES.filter(s => s.reward).flatMap(s => [].concat(s.reward).map(r => `<p>${isUnlocked(r) ? '✓' : '🔒'} ${esc(HEROES[r].name)}: clear ${esc(s.name)}</p>`)).join('')}`;
  if (tab === 'builds') return `<p>Each hero has a Balanced kit and two builds that trade one strength for another. Pick builds on the team screen by tapping a hero in a slot, or from the hero's details. Builds don't cost anything and can be swapped any time outside battle.</p>
${HERO_ORDER.map(id => `<h4 style="color:${HEROES[id].color}">${esc(HEROES[id].name)}${isUnlocked(id) ? '' : ' 🔒'}</h4>${BUILDS[id].slice(1).map(b => `<p><b style="color:var(--tx)">${b.icon} ${esc(b.name)}.</b> ${esc(b.desc)}</p>`).join('')}`).join('')}`;
  if (tab === 'enemies') {
    const ids = uniq(STAGES.flatMap(s => s.enemies).filter(id => !isHeroFoe(id)).concat(['homunculus']));
    return `<p>Every enemy in the campaign. Tap one for its moves. Stats shown are base values; stages scale them up.</p><div class="bestiary">${ids.map(id => `<button class="be" data-e="${id}"><span class="p">${enemyPortrait(id)}</span><b>${esc(ENEMIES[id].name)}</b></button>`).join('')}</div>`;
  }
  if (tab === 'balance') return balanceBody();
  if (tab === 'updates') return `<p>New features and content. Number changes are in Balance.</p>` + UPDATES.map(e => `<h4>v${esc(e.v)}</h4><ul class="chg">${e.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('');
  return '';
}
function showGuide(tab = 'basics') {
  UI.bt = null; closeSheet();
  app().innerHTML = `<div class="scr"><div class="top"><button class="ib" id="back" aria-label="Back">←</button><h2>Guide</h2></div>
<div class="tabs" role="tablist">${GUIDE_TABS.map(([k, l]) => `<button role="tab" class="tab ${k === tab ? 'on' : ''}" data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join('')}</div>
<div class="scroll guide">${guideBody(tab)}</div></div>`;
  $('#back').onclick = showTitle;
  $$('.tab').forEach(b => b.onclick = () => { SND.play('click'); showGuide(b.dataset.t); });
  $$('[data-e]').forEach(b => b.onclick = () => enemyInfoSheet(b.dataset.e));
  $$('[data-bf]').forEach(b => b.onclick = () => { UI.bf = b.dataset.bf; SND.play('click'); const sc = $('.scroll').scrollTop; showGuide('balance'); $('.scroll').scrollTop = sc; });
  const on = $('.tab.on'); if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function showHelp() { showGuide('basics'); }
